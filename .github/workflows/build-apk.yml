name: Crear APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Reposicion-APK-corregido.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -q Reposicion-APK-foto-corregida.zip -d proyecto

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Reposicion-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
